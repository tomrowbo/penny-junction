name: PennyApp
options:
  bundleIdPrefix: com.junction
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  PennyApp:
    type: application
    platform: iOS
    sources:
      - PennyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomrowbotham.junction.penny
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: X9YTM22ZL7
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          PENNY_API_BASE_URL: http://Toms-MacBook-Pro-8.local:3000
        Release:
          PENNY_API_BASE_URL: ""
    info:
      path: PennyApp/Info.plist
      properties:
        CFBundleDisplayName: Penny
        UILaunchScreen:
          UIColorName: BrandGreen
        PennyAPIBaseURL: $(PENNY_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: penny-open-banking
            CFBundleURLSchemes:
              - penny
  PennyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PennyAppTests
    dependencies:
      - target: PennyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomrowbotham.junction.penny.tests
        CODE_SIGNING_ALLOWED: NO
  PennyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PennyAppUITests
    dependencies:
      - target: PennyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomrowbotham.junction.penny.uitests
        CODE_SIGNING_ALLOWED: NO

